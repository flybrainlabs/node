[package]
name = "flypow"
version = "0.1.0"
edition = "2024"
description = "A deterministic, FlyHash-inspired proof-of-work research prototype"
license = "MIT OR Apache-2.0"
publish = false
default-run = "flypow"

[workspace]
members = ["crates/receipt-v1", "crates/sim-core", "crates/task-catalog", "crates/campaign-core", "crates/target-protocol", "crates/economic-core", "crates/service-core", "programs/flypow-campaign", "programs/flypow-economy-v2"]

[dependencies]
ed25519-dalek = "2.2"
getrandom = "0.3"
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8.4"
memmap2 = "0.9.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util"] }
flypow-target-protocol = { path = "crates/target-protocol" }
flypow-sim-core = { path = "crates/sim-core" }
flypow-economic-core = { path = "crates/economic-core" }
flypow-service-core = { path = "crates/service-core" }

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
